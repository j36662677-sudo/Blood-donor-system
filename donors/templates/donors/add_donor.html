
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Donor | LifeLine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1f2, #fee2e2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px #7f1d1d20;
        }

        .logo {
            text-align: center;
            font-size: 42px;
        }

        h1 {
            text-align: center;
            color: #b91c1c;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #374151;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #fecaca;
            border-color: #dc2626;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            accent-color: #dc2626;
        }

        .availability {
            display: flex;
            align-items: center;
            margin-top: 18px;
            color: #374151;
        }

        .availability label {
            margin: 0;
        }

        .errorlist {
            color: #dc2626;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #dc2626;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">🩸</div>
        <h1>Become a Donor</h1>
        <p class="subtitle">Your donation can help save a life.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Register as Donor</button>
        </form>

        <a class="back" href="{% url 'dashboard_home' %}">
            ← Back to Dashboard
        </a>
    </div>
</body>
</html>
