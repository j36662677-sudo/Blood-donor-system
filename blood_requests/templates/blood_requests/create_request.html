
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Blood Request | LifeLine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: Arial, sans-serif; }
        .header { background: #b91c1c; color: white; padding: 25px 0; }
        .form-card {
            max-width: 700px; margin: 35px auto; background: white;
            padding: 30px; border-radius: 16px;
            box-shadow: 0 5px 20px #0000000d;
        }
        .btn-danger { background: #b91c1c; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h2>❤️ LifeLine</h2>
            <p class="mb-0">Create a Blood Request</p>
        </div>
    </header>

    <main class="container">
        <div class="form-card">
            <h3 class="mb-4">Blood Request Form</h3>

            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <div class="text-danger">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-danger">
                    Submit Request
                </button>
                <a href="{% url 'request_list' %}"
                   class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </main>
</body>
</html>
