
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LifeLine</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1f2, #fee2e2);
        }

        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px #7f1d1d20;
        }

        .logo { text-align: center; font-size: 40px; }

        h1 {
            text-align: center;
            color: #b91c1c;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        input:focus {
            outline: 2px solid #fecaca;
            border-color: #dc2626;
        }

        .errorlist { color: #dc2626; }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #b91c1c; }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        a {
            color: #dc2626;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">🩸</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your LifeLine account</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </div>
    </div>
</body>
</html>
