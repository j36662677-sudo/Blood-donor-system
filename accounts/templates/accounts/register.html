
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LifeLine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff1f2, #fee2e2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(127, 29, 29, 0.13);
        }

        .logo {
            text-align: center;
            font-size: 38px;
        }

        h1 {
            color: #b91c1c;
            text-align: center;
            margin: 10px 0;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #374151;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px #fee2e2;
        }

        .helptext {
            display: block;
            color: #6b7280;
            font-size: 12px;
            margin-top: 6px;
        }

        ul.errorlist {
            color: #dc2626;
            font-size: 13px;
            padding-left: 20px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 9px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #b91c1c;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .footer a {
            color: #dc2626;
            font-weight: bold;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">🩸</div>
        <h1>Join LifeLine</h1>
        <p class="subtitle">Create your account and help save lives.</p>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.help_text %}
                    <div class="helptext">{{ field.help_text|safe }}</div>
                {% endif %}

                {{ field.errors }}
            {% endfor %}

            <button type="submit" class="register-btn">
                Create Account
            </button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>
</body>
</html>
